<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Details - UIU Social</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/profile.css">
    <link rel="stylesheet" href="css/club_detail.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <i class="fa-solid fa-graduation-cap mr-2 text-primary"></i>
                <div>
                    <a href="/index.html">UIU Social</a>
                    <!-- <div style="font-size: 10px; font-weight: normal; color: var(--text-muted); margin-top:2px; letter-spacing: 1px;">ACADEMIC COMMUNITY</div> -->
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item">
                    <i class="fa-solid fa-house"></i> Home
                </a>
                <a href="groups.html" class="nav-item">
                    <i class="fa-solid fa-users-line"></i> Department Groups
                </a>
                <a href="club_hub.html" class="nav-item active">
                    <i class="fa-solid fa-puzzle-piece"></i> Club Hub
                </a>
                <a href="events.html" class="nav-item">
                    <i class="fa-regular fa-calendar"></i> Events
                </a>
                <a href="messages.html" class="nav-item">
                    <i class="fa-regular fa-message"></i> Messages
                </a>
                <a href="admin.html" class="nav-item">
                    <i class="fa-solid fa-shield-halved"></i> Admin Panel
                </a>
            </nav>
            <div class="sidebar-footer">
                <a href="login.html" class="nav-item sign-out">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i> Sign Out
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content-container">
            <!-- Header -->
            <header class="top-header">
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Search clubs..." id="search-input">
                </div>
                <div class="header-actions">
                    <div class="header-icon">
                        <i class="fa-regular fa-bell"></i>
                        <span class="notification-badge"></span>
                    </div>
                    <div class="header-user">
                        <img src="/assets/images/students/kawsar.png?img=11" alt="User Avatar" class="avatar">
                    </div>
                </div>
            </header>

            <div class="main-content" id="club-detail-container" style="padding: 15px;">
                <div class="profile-header card">
                    <!-- Cover Banner - dynamic color -->
                    <div class="profile-cover" id="club-cover">
                        <div class="club-cover-icon" id="club-cover-icon">
                            <i id="club-cover-icon-el" class="fa-solid fa-puzzle-piece"></i>
                        </div>
                    </div>

                    <div class="profile-info-container">
                        <div id="club-avatar-wrap" class="profile-main-avatar club-avatar-wrap">
                            <img id="club-avatar-img" src="" alt="Club Logo" class="club-avatar-img">
                        </div>

                        <div class="profile-details">
                            <h2 id="club-name">Loading...</h2>
                            <div class="profile-meta">
                                <span id="club-category"></span>
                                • <span id="club-members"></span> Members
                                • Founded <span id="club-founded"></span>
                            </div>
                            <div id="club-tags" class="mt-2"></div>
                            <p id="club-about" class="mt-3 text-muted"></p>
                        </div>

                        <div class="profile-actions">
                            <button class="btn btn-primary" id="club-join-btn">
                                <i class="fa-solid fa-user-plus"></i> Join Club
                            </button>
                            <button class="btn btn-outline" id="club-share-btn">
                                <i class="fa-solid fa-share-nodes"></i> Share
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Tabs -->
                <div class="profile-tabs mt-4">
                    <a href="#" class="tab active" data-tab="posts">Recent Posts</a>
                    <a href="#" class="tab" data-tab="members">Members</a>
                    <a href="#" class="tab" data-tab="activities">Activities</a>
                </div>

                <div class="feed-section mt-3" id="tab-posts">
                    <!-- by js -->
                </div>

                <div class="feed-section mt-3" id="tab-members" style="display:none;">
                    <div class="card text-center text-muted p-5">
                        <i class="fa-solid fa-users mb-3" style="font-size:2rem;"></i>
                        <p>Member directory will be available once the backend is connected.</p>
                    </div>
                </div>

                <div class="feed-section mt-3" id="tab-activities" style="display:none;">
                    <!-- by js -->
                </div>

            </div>
        </main>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/club_detail.js"></script>
</body>

</html>

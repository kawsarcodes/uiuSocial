<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Hub - UIU Social</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/club_hub.css">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <i class="fa-solid fa-graduation-cap mr-2 text-primary"></i>
                <div>
                    <a href="/uiusocial/index.html">UIU Social</a>
                    <!-- <div style="font-size: 10px; font-weight: normal; color: var(--text-muted); margin-top:2px; letter-spacing: 1px;">ACADEMIC COMMUNITY</div> -->
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item">
                    <i class="fa-solid fa-house"></i> Home
                </a>
                <a href="groups.html" class="nav-item">
                    <i class="fa-solid fa-users-line"></i> Department Groups
                </a>
                <a href="announcements.html" class="nav-item">
                    <i class="fa-solid fa-bullhorn"></i> Announcements
                </a>
                <a href="club_hub.html" class="nav-item active">
                    <i class="fa-solid fa-puzzle-piece"></i> Club Hub
                </a>
                <a href="events.html" class="nav-item">
                    <i class="fa-regular fa-calendar"></i> Events
                </a>
                <a href="messages.html" class="nav-item">
                    <i class="fa-regular fa-message"></i> Messages
                </a>
                <a href="admin.html" class="nav-item">
                    <i class="fa-solid fa-shield-halved"></i> Admin Panel
                </a>
            </nav>
            <div class="sidebar-footer">
                <a href="login.html" class="nav-item sign-out text-danger"
                    style="color: var(--danger-color); font-weight: 600;">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i> Sign Out
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content" style="background-color: #fdf6f2;">
            <!-- Header -->
            <header class="top-header" style="background-color: #fff; border-bottom: 1px solid #fae6d8;">
                <div class="search-bar">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input type="text" placeholder="Search people, posts, groups, clubs, events...">
</div>

                <div class="header-actions">
                    <div class="header-icon"><i class="fa-regular fa-bell"></i></div>
                    <div class="header-user">
                        <img src="assets/images/students/kawsar.png?img=11" alt="User" class="avatar">
                    </div>
                </div>
            </header>

            <div class="page-content" style="display: flex; gap: 32px; width: 100%;">

                <!-- Main Feed Area -->
                <div class="club-feed" style="flex: 2;">

                    <div class="page-header" style="margin-bottom: 24px;">
                        <h1 style="color: #b54a1d; font-size: 28px; margin-bottom: 8px;">Club Hub</h1>
                        <p style="color: #665; font-size: 14px;">Connect with campus organizations, pursue your
                            passions, and grow your network beyond the classroom.</p>
                    </div>

                    <!-- Featured Clubs Section -->
                    <div class="section-title d-flex justify-content-between align-items-end mb-3">
                        <div>
                            <h3 style="font-size: 18px; color: #333; margin-bottom: 4px;" id="clubs-section-title">
                                Featured Clubs</h3>
                            <div style="font-size: 12px; color: #777;" id="clubs-subtitle">Most active and popular clubs
                                this semester</div>
                        </div>
                        <a href="#" id="view-all-clubs" style="color: #b54a1d; font-size: 13px; font-weight: 600;">View
                            All <i class="fa-solid fa-arrow-right ml-1"></i></a>
                    </div>

                    <!-- Club Categories -->
                    <!-- <h3 style="font-size: 18px; color: #333; margin-bottom: 12px; margin-top:32px;">Club Categories</h3> -->
                    <div class="category-pills mb-4">
                        <button class="pill active">All</button>
                        <button class="pill">Technology</button>
                        <button class="pill">Arts & Culture</button>
                        <button class="pill">Sports</button>
                        <button class="pill">Academic</button>
                    </div>

                    <div class="featured-clubs-grid mb-4" id="clubs-grid">
                        <!-- by js/club_hub.js -->
                    </div>

                    <!-- Announcements -->
                    <h3 style="font-size: 18px; color: #333; margin-bottom: 16px; margin-top:32px;">Recent Announcements
                    </h3>

                    <div class="announcements-feed">
                        <!-- by js/club_hub.js -->
                    </div>

                </div>

            
            </div>
        </main>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/club_hub.js"></script>
</body>

</html>
